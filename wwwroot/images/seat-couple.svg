<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 80" width="72" height="32">
  <!-- Gh? ?ôi - Two seats with shared armrest -->
  <!-- Seat 1 -->
  <rect x="10" y="15" width="65" height="35" rx="8" ry="8" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
  <rect x="15" y="50" width="55" height="8" rx="2" ry="2" fill="#999"/>
  <!-- Left armrest -->
  <rect x="5" y="25" width="8" height="25" rx="2" ry="2" fill="#888"/>
  
  <!-- Center armrest (shared) -->
  <rect x="82" y="20" width="16" height="40" rx="3" ry="3" fill="#888"/>
  
  <!-- Seat 2 -->
  <rect x="105" y="15" width="65" height="35" rx="8" ry="8" fill="#b0b0b0" stroke="#999" stroke-width="1"/>
  <rect x="110" y="50" width="55" height="8" rx="2" ry="2" fill="#999"/>
  <!-- Right armrest -->
  <rect x="177" y="25" width="8" height="25" rx="2" ry="2" fill="#888"/>
</svg>
