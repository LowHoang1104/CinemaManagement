<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Thanh toán MoMo (Test)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f2f6fb;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 480px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(11, 46, 90, 0.06);
        }
        h1 {
            color: #0b2e5a;
            margin: 0 0 12px;
            font-size: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #334;
            font-weight: 500;
        }
        select,
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d7e3f7;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #2b7cff;
            box-shadow: 0 0 0 3px rgba(43, 124, 255, 0.1);
        }
        .error {
            color: #d64545;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 8px;
            display: none;
        }
        .error.show {
            display: block;
        }
        input.invalid {
            border-color: #d64545;
        }
        select.invalid {
            border-color: #d64545;
        }
        .small {
            color: #6b7b95;
            font-size: 13px;
        }
        .info-row {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e8ecf3;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-size: 12px;
            color: #6b7b95;
            margin-bottom: 3px;
        }
        .info-value {
            font-size: 15px;
            color: #0b2e5a;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #2b7cff;
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover:not(:disabled) {
            background: #1e5fc9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(43, 124, 255, 0.3);
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .note {
            margin-top: 14px;
            padding: 12px;
            background: #f8fafc;
            border-left: 3px solid #2b7cff;
            border-radius: 4px;
        }
        .note-text {
            font-size: 12px;
            color: #6b7b95;
            margin: 0;
        }
        .total-amount {
            text-align: right;
            font-size: 13px;
            color: #6b7b95;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Thanh toán MoMo (Test)</h1>
        
        <div class="info-row">
            <div class="info-label">??n hàng</div>
            <div class="info-value" id="orderIdDisplay">--</div>
        </div>
        <div class="info-row">
            <div class="info-label">S? ti?n</div>
            <div class="info-value" id="amountDisplay">--</div>
        </div>

        <form id="paymentForm" method="post" action="/Momo/MockOtp">
            <input type="hidden" name="orderId" id="orderId" />
            <input type="hidden" name="amount" id="amount" />
            <input type="hidden" name="extraData" id="extraData" />

            <div class="form-group">
                <label for="bank">Ch?n ngân hàng</label>
                <select id="bank" name="bank" required>
                    <option value="">-- Ch?n --</option>
                    <option value="Vietcombank">Vietcombank</option>
                    <option value="Techcombank">Techcombank</option>
                    <option value="BIDV">BIDV</option>
                </select>
                <div id="bankError" class="error">Vui lòng ch?n ngân hàng</div>
            </div>

            <div class="form-group">
                <label for="cardNumber">S? th? (16 ch? s?)</label>
                <input id="cardNumber" name="cardNumber" placeholder="0123456789012345" maxlength="19" required />
                <div id="cardNumberError" class="error">S? th? ph?i ?úng 16 ch? s?</div>
            </div>

            <div class="form-group">
                <label for="cardName">Tên ch? th? (ch? cái và kho?ng tr?ng)</label>
                <input id="cardName" name="cardName" placeholder="NGUYEN VAN A" required />
                <div id="cardNameError" class="error">Tên ch? th? ch? ch?a ch? cái và kho?ng tr?ng</div>
            </div>

            <div class="form-group">
                <label for="expiry">Ngày h?t h?n (MM/YY)</label>
                <input id="expiry" name="expiry" placeholder="12/25" maxlength="5" required />
                <div id="expiryError" class="error">Ngày h?t h?n ph?i l?n h?n hôm nay (MM/YY)</div>
            </div>

            <div class="button-row">
                <div class="total-amount">
                    T?ng: <strong id="totalAmount">0 VND</strong>
                </div>
                <button id="submitBtn" class="btn btn-primary" type="submit" disabled>Ti?p t?c</button>
            </div>
        </form>

        <div class="note">
            <p class="note-text">?? L?u ý: ?ây là trang gi? l?p dành cho môi tr??ng phát tri?n.</p>
        </div>
    </div>

    <script>
        // L?y query params t? URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Kh?i t?o form v?i d? li?u t? URL
        function initializeForm() {
            const orderId = getQueryParam('orderId');
            const amount = getQueryParam('amount');
            const extraData = getQueryParam('extraData');

            if (orderId && amount && extraData) {
                document.getElementById('orderId').value = orderId;
                document.getElementById('amount').value = amount;
                document.getElementById('extraData').value = extraData;
                document.getElementById('orderIdDisplay').textContent = orderId;
                document.getElementById('amountDisplay').textContent = amount + ' VND';
                document.getElementById('totalAmount').textContent = parseInt(amount).toLocaleString('vi-VN') + ' VND';
            }
        }

        const cardNumberInput = document.getElementById('cardNumber');
        const cardNameInput = document.getElementById('cardName');
        const expiryInput = document.getElementById('expiry');
        const bankSelect = document.getElementById('bank');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('paymentForm');

        // X? lý input s? th? - ch? cho phép s?
        cardNumberInput.addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
            validateCardNumber();
        });

        // X? lý input tên ch? th? - ch? cho phép ch? cái và kho?ng tr?ng
        cardNameInput.addEventListener('input', function (e) {
            this.value = this.value.replace(/[^a-zA-Z\s]/g, '').toUpperCase();
            validateCardName();
        });

        // X? lý input ngày h?t h?n
        expiryInput.addEventListener('input', function (e) {
            let value = this.value.replace(/[^0-9]/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            this.value = value;
            validateExpiry();
        });

        // Các hàm validate
        function validateCardNumber() {
            const value = cardNumberInput.value.trim();
            const isValid = value.length === 16 && /^\d{16}$/.test(value);
            toggleError('cardNumber', !isValid);
            updateSubmitBtn();
            return isValid;
        }

        function validateCardName() {
            const value = cardNameInput.value.trim();
            const isValid = value.length > 0 && /^[a-zA-Z\s]+$/.test(value);
            toggleError('cardName', !isValid);
            updateSubmitBtn();
            return isValid;
        }

        function validateExpiry() {
            const value = expiryInput.value.trim();
            const isValid = isValidExpiryDate(value);
            toggleError('expiry', !isValid);
            updateSubmitBtn();
            return isValid;
        }

        function isValidExpiryDate(dateStr) {
            if (!/^\d{2}\/\d{2}$/.test(dateStr)) return false;

            const [month, year] = dateStr.split('/').map(Number);

            // Ki?m tra month 01-12
            if (month < 1 || month > 12) return false;

            const now = new Date();
            const currentYear = now.getFullYear() % 100; // L?y 2 ch? s? cu?i
            const currentMonth = now.getMonth() + 1;

            // Chuy?n year thành ??y ??
            const fullYear = year <= currentYear ? 2000 + year : 2000 + year;
            const expiryDate = new Date(fullYear, month - 1, 1); // Ngày ??u tiên c?a tháng h?t h?n
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            return expiryDate > today;
        }

        function toggleError(fieldName, showError) {
            const errorEl = document.getElementById(fieldName + 'Error');
            const inputEl = document.getElementById(fieldName);

            if (showError) {
                errorEl.classList.add('show');
                inputEl.classList.add('invalid');
            } else {
                errorEl.classList.remove('show');
                inputEl.classList.remove('invalid');
            }
        }

        function updateSubmitBtn() {
            const isCardValid = validateCardNumberQuick();
            const isNameValid = validateCardNameQuick();
            const isExpiryValid = validateExpiryQuick();
            const isBankSelected = bankSelect.value !== '';

            submitBtn.disabled = !(isCardValid && isNameValid && isExpiryValid && isBankSelected);
        }

        function validateCardNumberQuick() {
            const value = cardNumberInput.value.trim();
            return value.length === 16 && /^\d{16}$/.test(value);
        }

        function validateCardNameQuick() {
            const value = cardNameInput.value.trim();
            return value.length > 0 && /^[a-zA-Z\s]+$/.test(value);
        }

        function validateExpiryQuick() {
            const value = expiryInput.value.trim();
            return /^\d{2}\/\d{2}$/.test(value) && isValidExpiryDate(value);
        }

        // L?ng nghe s? thay ??i ngân hàng
        bankSelect.addEventListener('change', updateSubmitBtn);

        // Validate form tr??c khi submit
        form.addEventListener('submit', function (e) {
            if (!validateCardNumber() || !validateCardName() || !validateExpiry()) {
                e.preventDefault();
                return false;
            }
        });

        // Kh?i t?o
        window.addEventListener('DOMContentLoaded', initializeForm);
    </script>
</body>
</html>
